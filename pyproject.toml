[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "careful-memory"
version = "0.1.0"
description = "A production-grade long-term memory system for LLM agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    # Nothing under src/ imports sqlalchemy yet. It is kept (decision of
    # 2026-10-10) as the first step toward the SqlAlchemyStore of ADR-0017,
    # which is designed, not implemented (risk register R-05).
    "sqlalchemy>=2.0,<3",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
azure = [
    "pyodbc>=5.1",
    "azure-identity>=1.16",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.report]
# pytest-cov compares the total with --cov-fail-under at this precision
# (coverage's should_fail_under). At the default 0 a total of 90.74% rounds
# to 91 and passes a ratchet of 91 while the summary prints FAIL, which is
# how CI sat green from 2026-10-10 to 2026-10-19; at 2 the comparison is
# exact. Same fix as foundation-model, 2026-10-19.
precision = 2
