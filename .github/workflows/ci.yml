name: CI

# Runs the suite on every pull request and push to main. The guards that
# matter most here are the poisoning/isolation invariant tests
# (TestingStrategy.md) - exactly the kind that must fail a build, not wait
# for someone to run pytest by hand.
#
# mypy is declared in the dev extra but deliberately NOT a job yet: it
# reports findings on the current code, and a permanently red check teaches
# everyone to ignore checks. It arrives in the same change that fixes the
# findings, per the house rule.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        # --cov-fail-under is a ratchet at the measured baseline (91% on
        # 2026-08-24): raise it with the tests that earn it, never lower it.
        run: pytest --cov=careful_memory --cov-fail-under=91

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ruff
        run: python -m pip install ruff

      - name: ruff check
        run: ruff check .

  docs:
    # Stdlib-only source check over the Markdown (.github/scripts/check_docs.py):
    # every relative link resolves, no file has two front-matter blocks, and
    # the test counts the README and TestingStrategy.md state match tests/.
    # Added 2026-10-10 so a link or a stated count cannot drift from what is
    # on disk without the pull request going red. It does not yet check that a
    # test the README cites by name still exists.
    name: docs check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check docs
        run: python .github/scripts/check_docs.py
